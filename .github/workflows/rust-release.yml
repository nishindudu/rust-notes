name: rust

on:
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    release:
        name: Release - ${{ matrix.platform.release_for }}
        strategy:
            matrix:
                platform:
                    - os_name: Linux-x86-64
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-musl
                    - os_name: Windows-x86-64
                      os: ubuntu-latest
                      target: x86_64-pc-windows-gnu
        runs-on: ${{ matrix.platform.os }}
        
        steps:
            - uses: actions/checkout@v6
            - name: Build
              uses: houseabsolute/actions-rust-cross@v1.0.8
              with:
                target: ${{ matrix.platform.target }}
                args: "--locked --release"
                strip: true
            - name: Prepare release binary
              run: |
                    mkdir release
                      cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary }} \
                    release/rust-notes-${{ matrix.platform.os_name }}${{ endsWith(matrix.platform.binary, '.exe') && '.exe' || '' }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: rust-notes-${{ matrix.platform.os_name }}
                  path: release/*
